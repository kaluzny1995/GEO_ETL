[tox]
envlist = lint, py311
minversion = 4.0

[testenv]
skip_install = true
deps =
    requests>=2.31.0
    pydantic>=2.0.0
    python-dotenv>=1.0
    pyspark==3.5.5
    findspark>=2.0.0
    pytest>=7.0.0
commands =
    pytest {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff check --output-format=concise .

[testenv:format]
description = Check formatting (run `tox -e format-fix` to apply)
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff format --check .

[testenv:format-fix]
skip_install = true
deps =
    ruff>=0.6
commands =
    ruff format .

[testenv:typecheck]
skip_install = true
deps =
    mypy>=1.10
    types-requests
    requests>=2.31.0
    pydantic>=2.0.0
    python-dotenv>=1.0
    pyspark==3.5.5
    findspark>=2.0.0
commands =
    mypy

[testenv:warnings]
description = Run the test suite with Python warnings turned into errors
skip_install = true
deps =
    requests>=2.31.0
    pydantic>=2.0.0
    python-dotenv>=1.0
    pyspark==3.5.5
    findspark>=2.0.0
    pytest>=7.0.0
commands =
    pytest -W error::DeprecationWarning {posargs}
